<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标权限</title>
    <!-- 引入现代无衬线字体 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- 引入公共样式 -->
    <link rel="stylesheet" href="common.css">
    <style>
        /* 页面特有样式 */
        .permission-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1D2129;
        }

        .permission-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .permission-table th,
        .permission-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #F0F2F5;
        }

        .permission-table th {
            background-color: #F7F8FA;
            font-weight: 600;
            color: #4E5969;
            font-size: 14px;
        }

        .permission-table td {
            font-size: 14px;
            color: #1D2129;
        }

        .permission-toggle {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }

        .toggle-rail {
            width: 40px;
            height: 20px;
            background-color: #E5E6EB;
            border-radius: 10px;
            position: relative;
            transition: all 0.2s ease;
        }

        .toggle-handle {
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: all 0.2s ease;
        }

        .permission-toggle.active .toggle-rail {
            background-color: #165DFF;
        }

        .permission-toggle.active .toggle-handle {
            left: 22px;
        }

        /* ... existing code ... */

        /* 表格样式 */
        .table-container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #F7F8FA;
        }

        th {
            padding: 12px 16px;
            text-align: left;
            font-size: 14px;
            font-weight: 500;
            color: #4E5969;
            border-bottom: 1px solid #F0F2F5;
        }

        td {
            padding: 12px 16px;
            font-size: 14px;
            color: #1D2129;
            border-bottom: 1px solid #F0F2F5;
        }

        tr:hover td {
            background-color: #F7F8FA;
        }

        /* 按钮样式 */
        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: #165DFF;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0E42D2;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid #C9CDD4;
            color: #4E5969;
        }

        .btn-outline:hover {
            background-color: #F7F8FA;
            border-color: #86909C;
        }

        .btn-text {
            background-color: transparent;
            color: #165DFF;
        }

        .btn-text:hover {
            background-color: #F0F7FF;
        }

        /* 搜索框样式 */
        .search-container {
            display: flex;
            margin-bottom: 24px;
            gap: 12px;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 4px;
            border: 1px solid #C9CDD4;
            font-size: 14px;
            color: #1D2129;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #165DFF;
            box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #86909C;
        }

        /* 标签样式 */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 6px;
            background-color: #EEF4FF;
            color: #165DFF;
        }

        /* 筛选器样式 */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 500;
            color: #4E5969;
        }

        .filter-select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #C9CDD4;
            font-size: 14px;
            color: #1D2129;
            background-color: white;
        }

        /* 角色权限卡片样式 */
        .permission-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 24px;
        }

        .permission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .permission-title {
            font-size: 18px;
            font-weight: 600;
            color: #1D2129;
        }

        .permission-content {
            margin-top: 16px;
        }

        .permission-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
        }

        .permission-checkbox {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            border: 1px solid #C9CDD4;
            cursor: pointer;
        }

        .permission-name {
            font-size: 14px;
            color: #1D2129;
        }

        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background-color: white;
            border-radius: 12px;
            margin-top: 24px;
        }

        .pagination-info {
            font-size: 14px;
            color: #86909C;
        }

        .pagination-btn {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            border: 1px solid #C9CDD4;
            background-color: white;
            color: #4E5969;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .pagination-btn:hover {
            border-color: #165DFF;
            color: #165DFF;
        }

        .pagination-btn.active {
            background-color: #165DFF;
            color: white;
            border-color: #165DFF;
        }

        .pagination-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 右下角悬浮按钮 */
        .floating-action-button {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 900;
        }

        .fab-main {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #165DFF;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 93, 255, 0.4);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab-main:hover {
            background-color: #0E42D2;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(22, 93, 255, 0.5);
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <div class="nav-item" data-section="market" onclick="window.location.href='index.html'">指标市场</div>
        <div class="nav-item active" data-section="modeling">指标建模</div>
        <div class="nav-item" data-section="application" onclick="window.location.href='service_market.html'">指标应用</div>
        <div class="nav-item" data-section="governance" onclick="window.location.href='governance.html'">指标治理</div>
        <div class="nav-item" data-section="system" onclick="window.location.href='category_system.html'">系统管理</div>
    </div>
    
    <!-- 侧边导航栏 -->
    <div class="side-nav" id="side-nav">
        <div class="side-nav-content" id="market-content" style="display: none;">
            <div class="side-nav-item" data-page="map" onclick="window.location.href='index.html'">指标市场</div>
        </div>

        <div class="side-nav-content" id="modeling-content" style="display: block;">
            <div class="side-nav-item" data-page="metric-management" onclick="window.location.href='metric_management.html'">指标管理</div>
            <div class="side-nav-item" data-page="dimension-management" onclick="window.location.href='dimension_management.html'">维度管理</div>
            <div class="side-nav-item" data-page="metric-certification" onclick="window.location.href='metric_certification.html'">指标认证</div>
            <div class="side-nav-item active" data-page="metric-permission" onclick="window.location.href='metric_permission.html'">指标权限</div>
        </div>

        <div class="side-nav-content" id="application-content" style="display: none;">
            <div class="side-nav-item" data-page="service-market" onclick="window.location.href='service_market.html'">服务市场</div>
            <div class="side-nav-item" data-page="metric-api" onclick="window.location.href='metric_api.html'">指标API服务</div>
            <div class="side-nav-item" data-page="mcp-factory" onclick="window.location.href='mcp_factory.html'">MCP工场</div>
            <div class="side-nav-item" data-page="agent-market" onclick="window.location.href='agent_market.html'">Agent市场</div>
        </div>

        <div class="side-nav-content" id="governance-content" style="display: none;">
            <div class="side-nav-item" data-page="governance" onclick="window.location.href='governance.html'">指标治理</div>
        </div>

        <div class="side-nav-content" id="system-content" style="display: none;">
            <div class="side-nav-item" data-page="category-system" onclick="window.location.href='category_system.html'">指标分类体系</div>
            <div class="side-nav-item" data-page="metric-tag" onclick="window.location.href='metric_tag.html'">指标标签</div>
            <div class="side-nav-item" data-page="role-configuration" onclick="window.location.href='role_configuration.html'">角色配置</div>
        </div>
    </div>

    <script>
        // 切换顶部导航时显示对应的侧边菜单
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                // 移除所有顶部导航的active类
                document.querySelectorAll('.nav-item').forEach(navItem => {
                    navItem.classList.remove('active');
                });
                // 添加当前项的active类
                this.classList.add('active');
                
                // 隐藏所有侧边内容
                document.querySelectorAll('.side-nav-content').forEach(content => {
                    content.style.display = 'none';
                });
                
                // 显示对应的侧边内容
                const section = this.getAttribute('data-section');
                document.getElementById(section + '-content').style.display = 'block';
            });
        });
    </script>

    <div class="main-content">
        <div class="page-header">
            <h1>指标权限</h1>
            <p>此页面用于管理指标访问权限</p>
        </div>
        <!-- 这里可以添加指标权限的具体内容 -->
    </div>
</body>
</html>
