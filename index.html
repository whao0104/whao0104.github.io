<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标市场</title>
    <!-- 引入现代无衬线字体 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- 引入公共样式 -->
    <link rel="stylesheet" href="common.css">
    <style>
        /* 页面特有样式 */
        .filter-sidebar {
            position: fixed;
            top: 64px;
            left: 180px;
            bottom: 0;
            width: 240px;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 20px;
            z-index: 800;
            overflow-y: auto;
            transition: all 0.3s ease;
            border-left: 1px solid #F0F2F5;
        }

        .filter-section {
            margin-bottom: 24px;
        }

        .filter-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #1D2129;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-collapse {
            cursor: pointer;
            color: #86909C;
            font-size: 12px;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #4E5969;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #4E5969;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #F0F2F5;
        }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn.primary {
            background-color: #165DFF;
            color: white;
        }

        .btn.primary:hover {
            background-color: #0E42D2;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(22, 93, 255, 0.2);
        }

        .btn.secondary {
            background-color: #F2F3F5;
            color: #4E5969;
        }

        .btn.secondary:hover {
            background-color: #E5E6EB;
        }

        /* 主内容区域 */
        .main-content {
            margin-left: 460px;
            margin-top: 68px;
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            height: calc(100vh - 68px);
            box-sizing: border-box;
        }

        .page-header {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1D2129;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #4E5969;
            font-size: 14px;
        }

        /* 搜索栏样式 */
        .search-container {
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: #165DFF;
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.1);
        }

        /* 快速过滤栏 */
        .quick-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .filter-item label {
            color: #4E5969;
            font-weight: 500;
        }

        .filter-item input,
        .filter-item select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
            color: #1D2129;
        }

        .filter-item input:focus,
        .filter-item select:focus {
            outline: none;
            border-color: #165DFF;
            box-shadow: 0 0 0 3px rgba(22, 93, 255, 0.1);
        }

        .quick-filter-actions {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        /* 指标卡片容器 */
        .metrics-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        /* 指标卡片样式 */
        .metric-card {
            background-color: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .metric-card:hover {
            background-color: #F7FAFC;
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        .metric-card.high-importance {
            border-left: 4px solid #165DFF;
        }

        .metric-card.medium-importance {
            border-left: 4px solid #722ED1;
        }

        .metric-card.low-importance {
            border-left: 4px solid #00B42A;
        }

        .metric-name {
            font-weight: 600;
            font-size: 16px;
            color: #1D2129;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .metric-heat {
            display: flex;
            align-items: center;
            color: #FF7D00;
            font-size: 12px;
            font-weight: 500;
        }

        .metric-heat i {
            margin-right: 4px;
            font-size: 14px;
        }

        .metric-en-name {
            font-size: 14px;
            color: #86909C;
            margin-bottom: 12px;
        }

        .domain-tag {
            font-size: 12px;
            padding: 3px 10px;
            background-color: #E8F0FE;
            color: #165DFF;
            border-radius: 12px;
            display: inline-block;
            font-weight: 500;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .importance-tag {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
            font-weight: 500;
            margin-right: 6px;
            margin-bottom: 6px;
        }

        .importance-high {
            background-color: #E8F0FE;
            color: #165DFF;
        }

        .importance-medium {
            background-color: #F9F0FF;
            color: #722ED1;
        }

        .importance-low {
            background-color: #F0F9EB;
            color: #00B42A;
        }

        .certification-badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 12px;
            display: inline-block;
            font-weight: 500;
        }

        .certified {
            background-color: #E8F0FE;
            color: #165DFF;
        }

        .not-certified {
            background-color: #FFF1F0;
            color: #F53F3F;
        }

        .metric-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 14px;
            color: #4E5969;
        }

        .metric-definition {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #F0F2F5;
            font-size: 14px;
            color: #4E5969;
            line-height: 1.5;
        }

        /* 工具提示样式 */
        .tooltip {
            display: none;
            position: absolute;
            background-color: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            z-index: 100;
        }
    </style>
</head>

    <!-- 顶部导航栏 -->
    <div class="top-nav">

    <!-- 左侧筛选栏 -->
    <div class="filter-sidebar" id="filter-sidebar">
        <div class="filter-section">
            <div class="filter-title">业务域
                <span class="filter-collapse" onclick="toggleFilterSection('business-domain')">收起</span>
            </div>
            <div class="radio-group" id="business-domain">
                <div class="radio-option">
                    <input type="radio" name="business-domain" id="business-all" value="all" checked>
                    <label for="business-all">全部</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="business-domain" id="business-mobile" value="mobile">
                    <label for="business-mobile">移动端</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="business-domain" id="business-ott" value="ott">
                    <label for="business-ott">OTT端</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="business-domain" id="business-pc" value="pc">
                    <label for="business-pc">PC端</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="business-domain" id="business-miniprogram" value="miniprogram">
                    <label for="business-miniprogram">小程序端</label>
                </div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-title">主题域
                <span class="filter-collapse" onclick="toggleFilterSection('topic-domain')">收起</span>
            </div>
            <div class="radio-group" id="topic-domain">
                <div class="radio-option">
                    <input type="radio" name="topic-domain" id="topic-all" value="all" checked>
                    <label for="topic-all">全部</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="topic-domain" id="topic-exposure" value="exposure">
                    <label for="topic-exposure">曝光</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="topic-domain" id="topic-click" value="click">
                    <label for="topic-click">点击</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="topic-domain" id="topic-play" value="play">
                    <label for="topic-play">播放</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="topic-domain" id="topic-ad-consumption" value="ad-consumption">
                    <label for="topic-ad-consumption">广告消费</label>
                </div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-title">指标重要度
                <span class="filter-collapse" onclick="toggleFilterSection('importance')">收起</span>
            </div>
            <div class="checkbox-group" id="importance">
                <div class="checkbox-option">
                    <input type="checkbox" name="importance" id="importance-level1" value="level1">
                    <label for="importance-level1">一级</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" name="importance" id="importance-level2" value="level2">
                    <label for="importance-level2">二级</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" name="importance" id="importance-level3" value="level3">
                    <label for="importance-level3">三级</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" name="importance" id="importance-level4" value="level4">
                    <label for="importance-level4">四级</label>
                </div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-title">认证状态
                <span class="filter-collapse" onclick="toggleFilterSection('certification')">收起</span>
            </div>
            <div class="radio-group" id="certification">
                <div class="radio-option">
                    <input type="radio" name="certification" id="certification-all" value="all" checked>
                    <label for="certification-all">全部</label>
                </div>

                    <input type="radio" name="certification" id="certification-certified" value="certified">
                    <label for="certification-certified">已认证</label>
                </div>
                <div class="radio-option">

                </div>
            </div>
        </div>

        <div class="filter-section">

                <span class="filter-collapse" onclick="toggleFilterSection('tags')">收起</span>
            </div>
            <div class="checkbox-group" id="tags">
                <div class="checkbox-option">
                    <input type="checkbox" name="tag" id="tag-decision" value="decision">
                    <label for="tag-decision">决策</label>
                </div>

                    <label for="tag-movie">一级品类-电影</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" name="tag" id="tag-chinese-movie" value="chinese-movie">

                </div>
                <div class="checkbox-option">

                    <label for="tag-tv">一级品类-电视剧</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" name="tag" id="tag-chinese-tv" value="chinese-tv">
                    <label for="tag-chinese-tv">二级品类-国产电视剧</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" name="tag" id="tag-variety" value="variety">
                    <label for="tag-variety">一级品类-综艺</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" name="tag" id="tag-chinese-variety" value="chinese-variety">
                    <label for="tag-chinese-variety">二级品类-国产综艺</label>
                </div>
                <div class="checkbox-option">
                    <input type="checkbox" name="tag" id="tag-sports" value="sports">
                    <label for="tag-sports">一级品类-体育</label>
                </div>
            </div>
        </div>

        <div class="filter-actions">
            <button class="btn secondary" onclick="resetFilters()">重置</button>
            <button class="btn primary" onclick="applyFilters()">应用筛选</button>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">
            <h1>指标市场</h1>
        </div>

        <div class="search-container">
            <input type="text" class="search-bar" id="search-bar" placeholder="通过自然语言搜索指标，例如：'最近30天移动端DAU'" onkeyup="filterMetricsBySearch(event)">
        </div>

        <div class="quick-filter">
            <div class="filter-item">
                <label for="owner-search">负责人:</label>
                <input type="text" id="owner-search" placeholder="搜索负责人">
            </div>
            <div class="filter-item">
                <label for="create-time">创建时间:</label>
                <select id="create-time">
                    <option value="all">全部</option>
                    <option value="today">今天</option>
                    <option value="week">近7天</option>
                    <option value="month">近30天</option>
                    <option value="quarter">近90天</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="my-responsible">我负责的:</label>
                <input type="checkbox" id="my-responsible">
            </div>
            <div class="filter-item">
                <label for="my-favorite">我收藏的:</label>
                <input type="checkbox" id="my-favorite">
            </div>
            <div class="quick-filter-actions">
                <button class="btn secondary" onclick="resetQuickFilters()">重置</button>
                <button class="btn primary" onclick="applyQuickFilters()">应用</button>
            </div>
        </div>

        <div class="metrics-container" id="metrics-container">
            <!-- 指标卡片将通过JavaScript动态生成 -->
        </div>
    </div>

    <div class="tooltip" id="tooltip">

        // 生成指标卡片
        function renderMetricCards(metrics) {
            const container = document.getElementById('metrics-container');
            container.innerHTML = '';

            metrics.forEach(metric => {
                const card = document.createElement('div');
                card.className = 'metric-card ' + 
                    (metric.importance === 'level1' ? 'high-importance' : '') + 
                    (metric.importance === 'level2' ? 'medium-importance' : '') + 
                    (metric.importance === 'level3' || metric.importance === 'level4' ? 'low-importance' : '');
                card.dataset.id = metric.id;
                card.dataset.business = metric.businessDomain;
                card.dataset.platform = metric.platform;
                card.dataset.topic = metric.topicDomain;
                card.dataset.importance = metric.importance;
                card.dataset.certification = metric.certification;
                card.dataset.heat = metric.heat || Math.floor(Math.random() * 1000); // 添加热度数据属性
                metric.tags.forEach(tag => {
                    // 使用驼峰式命名法设置dataset属性
                    const camelCaseTag = 'tag' + tag.charAt(0).toUpperCase() + tag.slice(1);
                    card.dataset[camelCaseTag] = true;
                });

                // 生成标签HTML
                let tagsHtml = '';
                metric.tags.forEach(tag => {
                    // 映射标签到显示名称
                    const tagMap = {
                        'decision': '决策',
                        'live': '直播',
                        'commercial': '商业化',
                        'animation': '一级品类-动漫',
                        'chinese-animation': '二级品类-国产动漫',
                        'movie': '一级品类-电影',
                        'chinese-movie': '二级品类-国产电影',
                        'tv': '一级品类-电视剧',
                        'chinese-tv': '二级品类-国产电视剧',
                        'variety': '一级品类-综艺',
                        'chinese-variety': '二级品类-国产综艺',
                        'sports': '一级品类-体育'
                    };
                    tagsHtml += `<span class="domain-tag">${tagMap[tag] || tag}</span>`;
                });

                // 重要度标签
                let importanceHtml = '';
                const importanceMap = {
                    'level1': { name: '一级', class: 'importance-high' },
                    'level2': { name: '二级', class: 'importance-medium' },
                    'level3': { name: '三级', class: 'importance-low' },
                    'level4': { name: '四级', class: 'importance-low' }
                };
                importanceHtml = `<span class="importance-tag ${importanceMap[metric.importance].class}">${importanceMap[metric.importance].name}</span>`;

                // 认证状态标签
                let certificationHtml = '';
                certificationHtml = `<span class="certification-badge ${metric.certification === 'certified' ? 'certified' : 'not-certified'}">${metric.certification === 'certified' ? '已认证' : '未认证'}</span>`;

                // 热度标识
                let heatHtml = '';
                const heat = metric.heat || Math.floor(Math.random() * 1000); // 如果没有热度数据，使用随机数
                heatHtml = `<span class="metric-heat">🔥 ${heat}</span>`;

                // 构建卡片HTML
                card.innerHTML = `
                    <div class="metric-name">
                        ${metric.name}
                        ${certificationHtml}
                        ${heatHtml}
                    </div>
                    <div class="metric-en-name">${metric.enName}</div>
                    <div>
                        ${tagsHtml}
                        ${importanceHtml}
                    </div>
                    <div class="metric-meta">
                        <span>创建人: ${metric.creator}</span>
                        <span>创建时间: ${metric.createTime}</span>
                    </div>
                    <div class="metric-meta">
                        <span>更新时间: ${metric.updateTime}</span>
                    </div>
                    <div class="metric-definition">
                        ${metric.definition}
                    </div>
                `;

                // 添加卡片到容器
                container.appendChild(card);

                // 为卡片添加鼠标悬停事件以显示趋势图
                card.addEventListener('mouseenter', function(e) {
                    showTooltip(e, metric);
                });
                card.addEventListener('mouseleave', hideTooltip);

                // 为卡片添加点击事件，跳转到指标详情页
                card.addEventListener('click', function() {
                    window.location.href = 'metric_detail.html?metric=' + encodeURIComponent(metric.name);
                });

            });
        }

        // 初始渲染所有指标卡片
        renderMetricCards(metricsData);

        // 显示工具提示
        function showTooltip(event, metric) {
            const tooltip = document.getElementById('tooltip');
            document.getElementById('tooltip-metric-name').textContent = metric.name;

            tooltip.style.display = 'block';
            tooltip.style.left = (event.pageX + 10) + 'px';
            tooltip.style.top = (event.pageY + 10) + 'px';

            // 创建趋势图
            const ctx = document.getElementById('trend-chart').getContext('2d');

            // 如果已有图表则销毁
            if (window.currentChart) {
                window.currentChart.destroy();
            }

            window.currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['6天前', '5天前', '4天前', '3天前', '2天前', '昨天', '今天'],
                    datasets: [{
                        label: metric.name,
                        data: metric.trendData,
                        borderColor: '#165DFF',
                        backgroundColor: 'rgba(22, 93, 255, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        // 隐藏工具提示
        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }

        // 筛选栏折叠/展开功能
        function toggleFilterSection(sectionId) {
            const section = document.getElementById(sectionId);
            if (section.style.display === 'none') {
                section.style.display = 'block';
            } else {
                section.style.display = 'none';
            }
        }

        // 应用筛选
        function applyFilters() {
            const businessDomain = document.querySelector('input[name="business-domain"]:checked').value;
            const topicDomain = document.querySelector('input[name="topic-domain"]:checked').value;
            const importance = Array.from(document.querySelectorAll('input[name="importance"]:checked')).map(el => el.value);
            const certification = document.querySelector('input[name="certification"]:checked').value;
            const tags = Array.from(document.querySelectorAll('input[name="tag"]:checked')).map(el => el.value);

            // 筛选指标
            const filteredMetrics = metricsData.filter(metric => {
                // 业务域筛选
                if (businessDomain !== 'all' && metric.businessDomain !== businessDomain) {
                    return false;
                }

                // 主题域筛选
                if (topicDomain !== 'all' && metric.topicDomain !== topicDomain) {
                    return false;
                }

                // 重要度筛选
                if (importance.length > 0 && !importance.includes(metric.importance)) {
                    return false;
                }

                // 认证状态筛选
                if (certification !== 'all' && metric.certification !== certification) {
                    return false;
                }

                // 标签筛选
                if (tags.length > 0) {
                    return tags.every(tag => metric.tags.includes(tag));
                }

                return true;
            });

            // 渲染筛选后的指标卡片
            renderMetricCards(filteredMetrics);
        }

        // 重置筛选
        function resetFilters() {
            // 重置业务域
            document.getElementById('business-all').checked = true;

            // 重置主题域
            document.getElementById('topic-all').checked = true;

            // 重置重要度
            document.querySelectorAll('input[name="importance"]').forEach(input => {
                input.checked = false;
            });

            // 重置认证状态
            document.getElementById('certification-all').checked = true;

            // 重置标签
            document.querySelectorAll('input[name="tag"]').forEach(input => {
                input.checked = false;
            });

            // 应用筛选（显示所有指标）
            renderMetricCards(metricsData);
        }

        // 应用快速筛选
        function applyQuickFilters() {
            const ownerSearch = document.getElementById('owner-search').value.toLowerCase();
            const createTime = document.getElementById('create-time').value;
            const myResponsible = document.getElementById('my-responsible').checked;
            const myFavorite = document.getElementById('my-favorite').checked;

            // 筛选指标
            let filteredMetrics = metricsData.filter(metric => {
                // 负责人筛选
                if (ownerSearch && !metric.creator.toLowerCase().includes(ownerSearch)) {
                    return false;
                }

                // 创建时间筛选
                if (createTime !== 'all') {
                    const now = new Date();
                    const createDate = new Date(metric.createTime);
                    let timeDiff;

                    switch (createTime) {
                        case 'today':
                            timeDiff = now - createDate;
                            if (timeDiff > 24 * 60 * 60 * 1000) {
                                return false;
                            }
                            break;
                        case 'week':
                            timeDiff = now - createDate;
                            if (timeDiff > 7 * 24 * 60 * 60 * 1000) {
                                return false;
                            }
                            break;
                        case 'month':
                            timeDiff = now - createDate;
                            if (timeDiff > 30 * 24 * 60 * 60 * 1000) {
                                return false;
                            }
                            break;
                        case 'quarter':
                            timeDiff = now - createDate;
                            if (timeDiff > 90 * 24 * 60 * 60 * 1000) {
                                return false;
                            }
                            break;
                    }
                }

                // 我负责的筛选 (模拟，实际应用中需要用户信息)
                if (myResponsible && metric.creator !== '张三') {
                    return false;
                }

                // 我收藏的筛选 (模拟)
                if (myFavorite && metric.id % 3 !== 0) {
                    return false;
                }

                return true;
            });

            // 渲染筛选后的指标卡片
            renderMetricCards(filteredMetrics);
        }

        // 重置快速筛选
        function resetQuickFilters() {
            document.getElementById('owner-search').value = '';
            document.getElementById('create-time').value = 'all';
            document.getElementById('my-responsible').checked = false;
            document.getElementById('my-favorite').checked = false;

            // 应用筛选（显示所有指标）
            renderMetricCards(metricsData);
        }

        // 搜索框筛选
        function filterMetricsBySearch(event) {
            const searchTerm = event.target.value.toLowerCase();

            if (searchTerm.length < 2) {
                // 搜索词太短，显示所有指标
                renderMetricCards(metricsData);
                return;
            }

            // 筛选指标
            const filteredMetrics = metricsData.filter(metric => {
                return metric.name.toLowerCase().includes(searchTerm) ||
                       metric.enName.toLowerCase().includes(searchTerm) ||
                       metric.definition.toLowerCase().includes(searchTerm) ||
                       metric.creator.toLowerCase().includes(searchTerm);
            });

            // 渲染筛选后的指标卡片
            renderMetricCards(filteredMetrics);
        }

        // 切换顶部导航时显示对应的侧边菜单
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                // 移除所有顶部导航的active类
                document.querySelectorAll('.nav-item').forEach(navItem => {
                    navItem.classList.remove('active');
                });
                // 添加当前项的active类
                this.classList.add('active');

                // 隐藏所有侧边内容
                document.querySelectorAll('.side-nav-content').forEach(content => {
                    content.style.display = 'none';
                });

                // 显示对应的侧边内容
                const section = this.getAttribute('data-section');
                const contentElement = document.getElementById(section + '-content');
                contentElement.style.display = 'block';

                // 自动导航到第一个侧边导航项
                const firstNavItem = contentElement.querySelector('.side-nav-item');
                if (firstNavItem && firstNavItem.onclick) {
                    // 延迟触发，确保内容已显示
                    setTimeout(() => {
                        firstNavItem.click();
                    }, 100);
                }
            });
        });
