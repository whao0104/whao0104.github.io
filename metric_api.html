<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>指标API服务</title>
    <!-- 引入现代无衬线字体 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <!-- 引入公共样式 -->
    <link rel="stylesheet" href="common.css">
    <style>
        /* 页面特有样式 */
        .api-card {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            padding: 24px;
            margin-bottom: 24px;
        }

        .api-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .api-card-title {
            font-size: 18px;
            font-weight: 600;
            color: #1D2129;
        }

        .api-method {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            background-color: #EEF4FF;
            color: #165DFF;
        }

        .api-card-content {
            margin-top: 16px;
        }

        .api-description {
            font-size: 14px;
            color: #4E5969;
            margin-bottom: 16px;
        }

        .api-endpoint {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 14px;
            color: #1D2129;
            background-color: #F7F8FA;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            word-break: break-all;
        }

        .api-params-title {
            font-size: 16px;
            font-weight: 500;
            color: #1D2129;
            margin-bottom: 8px;
        }

        .api-params-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }

        .api-params-table th,
        .api-params-table td {
            padding: 8px 12px;
            text-align: left;
            font-size: 14px;
            border-bottom: 1px solid #F0F2F5;
        }

        .api-params-table th {
            font-weight: 500;
            color: #4E5969;
            background-color: #F7F8FA;
        }

        .api-params-table td {
            color: #1D2129;
        }

        /* 按钮样式 */
        .btn {
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background-color: #165DFF;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0E42D2;
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid #C9CDD4;
            color: #4E5969;
        }

        .btn-outline:hover {
            background-color: #F7F8FA;
            border-color: #86909C;
        }

        /* 标签样式 */
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            margin-right: 6px;
            background-color: #EEF4FF;
            color: #165DFF;
        }

        /* 搜索框样式 */
        .search-container {
            display: flex;
            margin-bottom: 24px;
            gap: 12px;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border-radius: 4px;
            border: 1px solid #C9CDD4;
            font-size: 14px;
            color: #1D2129;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #165DFF;
            box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #86909C;
        }

        /* 筛选器样式 */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .filter-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 500;
            color: #4E5969;
        }

        .filter-select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #C9CDD4;
            font-size: 14px;
            color: #1D2129;
            background-color: white;
        }

        /* 分页样式 */
        .pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding: 16px;
            background-color: white;
            border-radius: 12px;
            margin-top: 24px;
        }

        .pagination-info {
            font-size: 14px;
            color: #86909C;
        }

        .pagination-btn {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            border: 1px solid #C9CDD4;
            background-color: white;
            color: #4E5969;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .pagination-btn:hover {
            border-color: #165DFF;
            color: #165DFF;
        }

        .pagination-btn.active {
            background-color: #165DFF;
            color: white;
            border-color: #165DFF;
        }

        .pagination-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="top-nav">
        <div class="nav-item" data-section="market" onclick="window.location.href='index.html'">指标市场</div>
        <div class="nav-item" data-section="modeling" onclick="window.location.href='metric_management.html'">指标建模</div>
        <div class="nav-item active" data-section="application">指标应用</div>
        <div class="nav-item" data-section="governance" onclick="window.location.href='governance.html'">指标治理</div>
        <div class="nav-item" data-section="system" onclick="window.location.href='category_system.html'">系统管理</div>
    </div>
    
    <!-- 侧边导航栏 -->
    <div class="side-nav" id="side-nav">
        <div class="side-nav-content" id="market-content" style="display: none;">
            <div class="side-nav-item" data-page="map" onclick="window.location.href='index.html'">指标市场</div>
        </div>

        <div class="side-nav-content" id="modeling-content" style="display: none;">
            <div class="side-nav-item" data-page="metric-management" onclick="window.location.href='metric_management.html'">指标管理</div>
            <div class="side-nav-item" data-page="dimension-management" onclick="window.location.href='dimension_management.html'">维度管理</div>
            <div class="side-nav-item" data-page="metric-certification" onclick="window.location.href='metric_certification.html'">指标认证</div>
            <div class="side-nav-item" data-page="metric-permission" onclick="window.location.href='metric_permission.html'">指标权限</div>
        </div>

        <div class="side-nav-content" id="application-content" style="display: block;">
            <div class="side-nav-item" data-page="service-market" onclick="window.location.href='service_market.html'">服务市场</div>
            <div class="side-nav-item active" data-page="metric-api" onclick="window.location.href='metric_api.html'">指标API服务</div>
            <div class="side-nav-item" data-page="mcp-factory" onclick="window.location.href='mcp_factory.html'">MCP工场</div>
            <div class="side-nav-item" data-page="agent-market" onclick="window.location.href='agent_market.html'">Agent市场</div>
            <div class="side-nav-item" data-page="metric-monitoring" onclick="window.location.href='metric_monitoring.html'">指标监控</div>
            <div class="side-nav-item" data-page="metric-acceleration" onclick="window.location.href='metric_acceleration.html'">指标加速</div>
        </div>

        <div class="side-nav-content" id="governance-content" style="display: none;">
            <div class="side-nav-item" data-page="governance" onclick="window.location.href='governance.html'">指标治理</div>
        </div>

        <div class="side-nav-content" id="system-content" style="display: none;">
            <div class="side-nav-item" data-page="category-system" onclick="window.location.href='category_system.html'">指标分类体系</div>
            <div class="side-nav-item" data-page="metric-tag" onclick="window.location.href='metric_tag.html'">指标标签</div>
            <div class="side-nav-item" data-page="role-configuration" onclick="window.location.href='role_configuration.html'">角色配置</div>
        </div>
    </div>

    <script>
        // 切换顶部导航时显示对应的侧边菜单
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                // 移除所有顶部导航的active类
                document.querySelectorAll('.nav-item').forEach(navItem => {
                    navItem.classList.remove('active');
                });
                // 添加当前项的active类
                this.classList.add('active');
                
                // 隐藏所有侧边内容
                document.querySelectorAll('.side-nav-content').forEach(content => {
                    content.style.display = 'none';
                });
                
                // 显示对应的侧边内容
                const section = this.getAttribute('data-section');
                document.getElementById(section + '-content').style.display = 'block';
            });
        });
    </script>

    <div class="main-content">
        <div class="page-header">
            <h1>指标API服务</h1>
            <p>此页面提供指标相关的API服务</p>
        </div>
        <!-- 这里可以添加指标API服务的具体内容 -->
    </div>
</body>
</html>
